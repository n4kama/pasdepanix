# OmniWM configuration — https://github.com/BarutSRB/OmniWM
#
# Deployed as a *writable copy* to ~/.config/omniwm/settings.toml by
# home-manager (see omniwm.nix). The repo wins on every switch.
#
# IMPORTANT — this must be the COMPLETE schema (OmniWM >= 0.6.3):
#  - A missing required key invalidates the WHOLE file. OmniWM then preserves
#    it as settings.toml.corrupt and resets to defaults. Omitted keys do NOT
#    fall back to built-in defaults any more; that was true up to 0.6.2 only.
#  - `hotkeys` must list every assignable action EXACTLY ONCE — 188 entries as
#    of 0.6.5. Unknown, unassignable, missing or duplicate ids invalidate the
#    file. Unbind with `binding = "Unassigned"`; never delete the entry.
#  - `schemaVersion` is required. `appRules` and `workspaces` are the only
#    arrays that need not be exhaustive.
#
# => Never hand-write this file from scratch. To change something: edit it
#    here (safe for values on keys that already exist), or let OmniWM write it
#    and copy ~/.config/omniwm/settings.toml back over this file. After an
#    OmniWM release with a schema bump, OmniWM migrates the live file in place
#    (it is writable now) — copy the migrated result back here.
#
# Bindings use OmniWM's human-readable format: modifiers joined with "+" in the
# order Control+Option+Shift+Command, then the key name.
# Examples: "Option+1", "Option+Shift+H", "Control+Option+Space".
#
# Only deliberate appRules live here (layout / float / workspace assignment).
# OmniWM's GUI auto-captures a min-window-size rule for every window it sees;
# those are stripped as noise since they just restate its defaults.

monitorBarOverrides = []
monitorDwindleOverrides = []
monitorGapOverrides = []
monitorNiriOverrides = []
monitorOrientationOverrides = []
monitorRoutingOverrides = []
schemaVersion = 2

[appearance]
mode = "dark"

[borders]
enabled = true
width = 1.5

[borders.color]
alpha = 1.0
blue = 0.8708789348602295
green = 0.3338356415197201
red = 0.3827269129873655

[clipboard]
historyEnabled = false
maxItemBytes = 8388608
maxItems = 200
maxTotalBytes = 67108864

[dwindle]
defaultSplitRatio = 1.0
moveToRootStable = true
singleWindowFit = "fill"
smartSplit = false
splitWidthMultiplier = 1.5
useGlobalGaps = true

[focus]
crossesMonitorAtEdge = false
followsMouse = false
followsWindowToMonitor = false
lockModifier = "off"
moveCrossesMonitorAtEdge = false
moveMouseToFocusedWindow = false
raiseOnMouseFocus = false

[gaps]
fullscreenUsesOuterGaps = false
size = 16.0

[gaps.outer]
bottom = 0.0
left = 0.0
right = 0.0
top = 0.0

[general]
animationsEnabled = true
defaultLayoutType = "dwindle"
hotkeysEnabled = true
hyperKeyModifiers = "Control+Option+Shift+Command"
ipcEnabled = false
preventSleepEnabled = false
systemHyperTrigger = "None"
updateChecksEnabled = true

[gestures]
fingerCount = 3
invertDirection = true
mouseMoveModifierKey = "option"
mouseResizeModifierKey = "option"
scrollEnabled = true
scrollModifierKey = "optionShift"
scrollSensitivity = 5.0
trackpadScrollStyle = "snap"
workspaceSwipeAxis = "vertical"
workspaceSwipeEnabled = false
workspaceSwipeFingerCount = 3

[hiddenBar]
enabled = true
hiddenBundleIDs = []
rehideIntervalSeconds = 5.0

[mouseWarp]
constrainToArrangement = false
enabled = false
margin = 1

[niri]
alwaysCenterSingleColumn = false
centerFocusedColumn = "never"
containerPrimarySpanPresets = [0.3333333333333333, 0.5, 0.6666666666666666]
defaultContainerPrimarySpan = 0.5
infiniteLoop = false
singleWindowFit = "fill"
visibleContainerCount = 2

[overview]
zoom = 1.0

[overview.backdrop]
alpha = 1.0
blue = 0.08
green = 0.05
red = 0.05

[overview.windowBorders]

[overview.windowBorders.hovered]
alpha = 1.0
blue = 1.0
green = 0.6
red = 0.4

[overview.windowBorders.normal]
alpha = 0.5
blue = 0.35
green = 0.3
red = 0.3

[overview.windowBorders.selected]
alpha = 1.0
blue = 0.4
green = 0.8
red = 0.3

[quakeTerminal]
animationDuration = 0.2
autoHide = false
backgroundBlurRadius = 0
backgroundEffect = "standardBlur"
enabled = true
heightPercent = 50.0
monitorMode = "focusedWindow"
opacity = 1.0
position = "center"
widthPercent = 50.0

[routing]
mode = "macOS"

[scratchpads]

[scratchpads.labels]

[statusBar]
showAppNames = false
showWorkspaceName = false
useWorkspaceId = false

[workspaceBar]
backgroundOpacity = 0.1
deduplicateAppIcons = false
enabled = false
excludedBundleIDs = []
height = 24.0
hideEmptyWorkspaces = false
hideInNativeFullscreen = false
notchActiveZoneWidth = 180.0
notchMode = "moveBelowMenuBar"
position = "overlappingMenuBar"
reserveLayoutSpace = false
revealHoldMilliseconds = 200.0
revealModifier = "off"
showFloatingWindows = false
showLabels = true
systemStatsButton = false
windowLevel = "popup"
xOffset = 0.0
yOffset = 0.0

