# OmniWM configuration — https://github.com/BarutSRB/OmniWM
#
# This file is symlinked to ~/.config/omniwm/settings.toml by home-manager
# (PaNix/home/features/desktop/omniwm/omniwm.nix) so you can edit it here and
# have changes tracked in the repo.
#
# IMPORTANT NOTES (verified against OmniWM source):
#  - Any key omitted from this file falls back to OmniWM's built-in default,
#    so this file only needs to contain what you care about. Below we pin the
#    full hotkey list so every binding is visible and editable.
#  - The `hotkeys` array is NOT merged with defaults: it is the complete set.
#    Any action you remove from this list becomes UNBOUND. Edit the existing
#    lines rather than shipping a partial list.
#  - Bindings use OmniWM's human-readable format: modifiers joined with "+"
#    in the order Control+Option+Shift+Command, then the key name.
#    Examples: "Option+1", "Option+Shift+H", "Control+Option+Space", "Option+Shift+Page Up".
#  - OmniWM rewrites this file atomically when you change settings in its GUI,
#    which replaces the symlink with a real file. Prefer editing here by hand;
#    if you use the in-app Settings UI, copy changes back into this file.

# ── Workspaces ────────────────────────────────────────────────────────────
# alt-1..9 switch workspace, alt-shift-1..9 move window to workspace
# (matches the AeroSpace setup that was in use).
[[hotkeys]]
id = "switchWorkspace.0"
binding = "Option+1"
[[hotkeys]]
id = "switchWorkspace.1"
binding = "Option+2"
[[hotkeys]]
id = "switchWorkspace.2"
binding = "Option+3"
[[hotkeys]]
id = "switchWorkspace.3"
binding = "Option+4"
[[hotkeys]]
id = "switchWorkspace.4"
binding = "Option+5"
[[hotkeys]]
id = "switchWorkspace.5"
binding = "Option+6"
[[hotkeys]]
id = "switchWorkspace.6"
binding = "Option+7"
[[hotkeys]]
id = "switchWorkspace.7"
binding = "Option+8"
[[hotkeys]]
id = "switchWorkspace.8"
binding = "Option+9"

[[hotkeys]]
id = "moveToWorkspace.0"
binding = "Option+Shift+1"
[[hotkeys]]
id = "moveToWorkspace.1"
binding = "Option+Shift+2"
[[hotkeys]]
id = "moveToWorkspace.2"
binding = "Option+Shift+3"
[[hotkeys]]
id = "moveToWorkspace.3"
binding = "Option+Shift+4"
[[hotkeys]]
id = "moveToWorkspace.4"
binding = "Option+Shift+5"
[[hotkeys]]
id = "moveToWorkspace.5"
binding = "Option+Shift+6"
[[hotkeys]]
id = "moveToWorkspace.6"
binding = "Option+Shift+7"
[[hotkeys]]
id = "moveToWorkspace.7"
binding = "Option+Shift+8"
[[hotkeys]]
id = "moveToWorkspace.8"
binding = "Option+Shift+9"

[[hotkeys]]
id = "workspaceBackAndForth"
binding = "Option+Tab"

# ── Focus ─────────────────────────────────────────────────────────────────
[[hotkeys]]
id = "focus.left"
binding = "Option+H"
[[hotkeys]]
id = "focus.down"
binding = "Option+J"
[[hotkeys]]
id = "focus.up"
binding = "Option+K"
[[hotkeys]]
id = "focus.right"
binding = "Option+L"
[[hotkeys]]
id = "focusPrevious"
binding = "Option+Shift+Tab"

# ── Move / arrange windows ────────────────────────────────────────────────
[[hotkeys]]
id = "move.left"
binding = "Option+Shift+H"
[[hotkeys]]
id = "move.down"
binding = "Option+Shift+J"
[[hotkeys]]
id = "move.up"
binding = "Option+Shift+K"
[[hotkeys]]
id = "move.right"
binding = "Option+Shift+L"
[[hotkeys]]
id = "moveWindowToWorkspaceUp"
binding = "Control+Option+Shift+K"
[[hotkeys]]
id = "moveWindowToWorkspaceDown"
binding = "Control+Option+Shift+J"

# ── Monitors ──────────────────────────────────────────────────────────────
[[hotkeys]]
id = "focusMonitorNext"
binding = "Control+Command+Tab"
[[hotkeys]]
id = "focusMonitorLast"
binding = "Control+Command+Grave"

# ── Sizing / layout ───────────────────────────────────────────────────────
[[hotkeys]]
id = "toggleFullscreen"
binding = "Option+F"
[[hotkeys]]
id = "balanceSizes"
binding = "Option+Shift+B"
[[hotkeys]]
id = "toggleWorkspaceLayout"
binding = "Control+Option+Shift+L"
[[hotkeys]]
id = "swapSplit"
binding = "Option+Shift+S" # dwindle: mirror the split to the other side of the screen
[[hotkeys]]
id = "toggleFocusedWindowFloating"
binding = "Option+Shift+Space" # float/un-float the focused window (AeroSpace default)
# bsp/dwindle resize (hjkl): grow/shrink the right & bottom borders.
[[hotkeys]]
id = "resizeGrow.right"
binding = "Control+Option+L" # wider
[[hotkeys]]
id = "resizeShrink.right"
binding = "Control+Option+H" # narrower
[[hotkeys]]
id = "resizeGrow.down"
binding = "Control+Option+J" # taller
[[hotkeys]]
id = "resizeShrink.down"
binding = "Control+Option+K" # shorter

# ── Tools ─────────────────────────────────────────────────────────────────
[[hotkeys]]
id = "toggleOverview"
binding = "Option+Shift+O"
[[hotkeys]]
id = "openCommandPalette"
binding = "Control+Option+P" # Control+Option+Space collides with macOS "Select next input source"
[[hotkeys]]
id = "openMenuAnywhere"
binding = "Control+Option+M"
[[hotkeys]]
id = "toggleQuakeTerminal"
binding = "Option+Grave"
[[hotkeys]]
id = "raiseAllFloatingWindows"
binding = "Option+Shift+R"

# ── Settings (from OmniWM GUI state) ──────────────────────────────────────
[appearance]
mode = "dark"

[borders]
enabled = true
width = 2.5

[borders.color]
alpha = 1.0
blue = 0.979300037944676
green = 1.0
red = 0.08458520228437894

[clipboard]
historyEnabled = false
maxItemBytes = 8388608
maxItems = 200
maxTotalBytes = 67108864

[dwindle]
defaultSplitRatio = 1.0
moveToRootStable = true
singleWindowFit = "fill"
smartSplit = false
splitWidthMultiplier = 1.5
useGlobalGaps = true

[focus]
crossesMonitorAtEdge = false
followsMouse = false
followsWindowToMonitor = false
moveCrossesMonitorAtEdge = false
moveMouseToFocusedWindow = false

[gaps]
size = 16.0

[gaps.outer]
bottom = 0.0
left = 0.0
right = 0.0
top = 0.0

[general]
animationsEnabled = true
defaultLayoutType = "dwindle"
hotkeysEnabled = true
ipcEnabled = false
preventSleepEnabled = false
systemHyperTrigger = "None"
updateChecksEnabled = true

[gestures]
fingerCount = 3
invertDirection = true
mouseResizeModifierKey = "option"
scrollEnabled = true
scrollModifierKey = "optionShift"
scrollSensitivity = 5.0
trackpadScrollStyle = "snap"

[mouseWarp]
enabled = false
margin = 1

[quakeTerminal]
animationDuration = 0.2
autoHide = false
enabled = true
heightPercent = 50.0
monitorMode = "focusedWindow"
opacity = 1.0
position = "center"
widthPercent = 50.0

[routing]
mode = "macOS"

[statusBar]
showAppNames = false
showWorkspaceName = false
useWorkspaceId = false

[workspaceBar]
backgroundOpacity = 0.1
deduplicateAppIcons = false
enabled = false
height = 24.0
hideEmptyWorkspaces = false
position = "overlappingMenuBar"
reserveLayoutSpace = false
showFloatingWindows = false
showLabels = true
windowLevel = "popup"
xOffset = 0.0
yOffset = 0.0

# ── Per-app window rules ───────────────────────────────────────────────────
# Only deliberate rules live here. OmniWM's GUI auto-captures a per-app
# min-window-size rule for every window it observes; those were stripped since
# they just restate OmniWM's defaults and add noise. Add a rule only for a
# behaviour you actually want (layout, float, workspace assignment).
[[appRules]]
assignToWorkspace = "4"
bundleId = "com.apple.mail"
id = "C84A9686-37F4-4039-8042-B731FBD406E2"

